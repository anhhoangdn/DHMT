# Cấu hình mặc định cho DECA_DHMT
mediapipe:
  max_num_faces: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  static_image_mode: true
  max_image_size: null
  frame_stride: 1
  save_annotated: true
  save_json: true

deca:
  root: "external/DECA"
  device: "cuda"  # hoặc "cpu"
  save_mesh: true
  save_texture: true
  save_rendered_image: true
  batch_size: 1
  save_obj: true

performance:
  fast_mode:
    max_image_size: 1024
    frame_stride: 2
    save_annotated: false
    save_json: true
    deca_batch_size: 4
    save_obj: false

output:
  landmarks_dir: "outputs/landmarks2d"
  meshes_dir: "outputs/meshes"
  textures_dir: "outputs/textures"
  renders_dir: "outputs/renders"
  videos_dir: "outputs/videos"

logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] %(message)s"
